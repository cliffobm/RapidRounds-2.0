name: Report an app problem
description: Tell us what happened in everyday language.
title: '[Problem] '
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Rapid Rounds. You do not need technical words.
        This report is visible to people who can access this repository. Do not include passwords, sign-in links, access keys, patient details, student records, or pictures containing private information. Review any diagnostic report before attaching it.
  - type: dropdown
    id: area
    attributes:
      label: Where did the problem happen?
      options:
        - Opening the app
        - Questions or explanations
        - Case scenarios
        - Rewards or saved progress
        - Sign-in or account
        - Profile, photo, or settings
        - Read-aloud or accessibility
        - Something else
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      placeholder: I tapped Start in Rapid Fire, but the screen stayed blank.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      description: List the buttons or actions you took. If it happened only once, say so.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and system version
      placeholder: iPhone 15, iOS 18.6; or Pixel 8, Android 16
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: App version and build number
      description: Look in TestFlight or the app's Help and diagnostics screen. Include an update ID if shown.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: How much does this stop you?
      options:
        - I cannot use the app
        - An important feature does not work
        - I can continue with a workaround
        - Small visual or wording issue
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional screenshot or diagnostic report
      description: Remove personal information first. For a question concern, include its content ID instead of personal clinical examples.
