name: Sprint 4 validation
on:
  push:
    branches: [feature/cjis-foundation, sprint4/cjis-source-migration]
  pull_request:
    branches: [feature/cjis-foundation]
permissions:
  contents: read
jobs:
  sprint4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate:sprint4
      - run: npm run qbank:validate
  legacy-regression:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-development-key
      SUPABASE_SERVICE_ROLE_KEY: local-development-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Legacy lint gate
        run: npm run lint
      - name: Legacy unit regression gate
        if: ${{ !cancelled() }}
        run: npm run test -- --maxWorkers=2 --minWorkers=1
      - name: Build gate
        if: ${{ !cancelled() }}
        run: npm run build
