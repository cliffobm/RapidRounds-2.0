name: CJIS development checks
on:
  push:
    branches: [feature/cjis-foundation]
  pull_request:
permissions:
  contents: read
jobs:
  cjis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:cjis
      - run: npx vitest run lib/cjis components/qbank/LegacyPractice.spec.tsx components/learning/Experience.spec.tsx components/settings/Settings.spec.tsx
      - run: npm run typecheck
      - run: npm run build
  legacy-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Keep inherited failures visible; do not hide them to make CI green.
      - run: npm test
