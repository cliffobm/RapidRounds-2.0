name: CJIS development checks
on:
  push:
    branches: [feature/cjis-foundation]
  pull_request:
permissions:
  contents: read
jobs:
  cjis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:cjis
      - run: npx vitest run lib/cjis lib/learning lib/review-auth.spec.ts lib/review-middleware.spec.ts app/auth/ReviewSession.spec.tsx components/auth components/qbank/LegacyPractice.spec.tsx components/learning/Experience.spec.tsx components/learning/Readiness.spec.tsx components/learning/ContentExpansion.spec.tsx components/learning/InlineReferences.spec.tsx components/learning/Evolving.spec.tsx components/learning/CaseDebrief.spec.tsx components/learning/UnifiedPractice.spec.tsx components/learning/ProgressExperience.spec.tsx components/learning/StudyResume.spec.tsx components/settings/Settings.spec.tsx
      - run: npm run typecheck
      - run: npm run build
      # The original H.264 logo video needs a branded browser's media codecs.
      # GitHub's Ubuntu image includes Chrome; avoid unnecessary apt downloads.
      # Keep the installer fallback when that executable is not available.
      - name: Ensure official Chrome is available
        run: |
          if [ -x /opt/google/chrome/chrome ]; then
            /opt/google/chrome/chrome --version
          else
            npx playwright install --with-deps chrome
          fi
      - run: npx playwright test --config playwright.cjis.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7
  legacy-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Run the complete regression suite, including repaired inherited tests.
      - run: npm test
